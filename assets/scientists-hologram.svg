<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430">
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0" stop-color="#12091f"/>
      <stop offset="0.5" stop-color="#24103b"/>
      <stop offset="1" stop-color="#100d2b"/>
    </linearGradient>
    <linearGradient id="holo" x1="0" x2="1">
      <stop offset="0" stop-color="#ffb7e8"/>
      <stop offset="0.5" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#93c5fd"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="hologram">
      <feColorMatrix type="matrix" values="
        0.45 0 0 0 0.25
        0 0.20 0 0 0.10
        0 0 0.75 0 0.45
        0 0 0 0.82 0"/>
      <feComponentTransfer>
        <feFuncR type="gamma" amplitude="1.15" exponent="0.8" offset="0"/>
        <feFuncG type="gamma" amplitude="1.15" exponent="0.8" offset="0"/>
        <feFuncB type="gamma" amplitude="1.25" exponent="0.8" offset="0"/>
      </feComponentTransfer>
    </filter>
    <clipPath id="c1"><circle cx="205" cy="205" r="105"/></clipPath>
    <clipPath id="c2"><circle cx="600" cy="205" r="105"/></clipPath>
    <clipPath id="c3"><circle cx="995" cy="205" r="105"/></clipPath>
    <pattern id="scan" width="6" height="8" patternUnits="userSpaceOnUse">
      <rect width="6" height="2" fill="#ffffff" opacity=".16"/>
    </pattern>
  </defs>

  <rect width="1200" height="430" rx="34" fill="url(#bg)"/>
  <circle cx="70" cy="55" r="2" fill="#fff" opacity=".7"/>
  <circle cx="1130" cy="80" r="2" fill="#fff" opacity=".8"/>
  <circle cx="1070" cy="360" r="3" fill="#f9a8d4" opacity=".8"/>
  <text x="600" y="48" text-anchor="middle" fill="#f5d0fe" font-family="Georgia,serif" font-size="25" font-weight="700" letter-spacing="5">HOLOGRAPHIC THINKERS ✦</text>
  <text x="600" y="78" text-anchor="middle" fill="#c4b5fd" font-family="Arial,sans-serif" font-size="14" letter-spacing="2">IDEAS • MATHEMATICS • PHYSICS • INVENTION</text>

  <!-- Einstein -->
  <g filter="url(#glow)">
    <circle cx="205" cy="205" r="112" fill="none" stroke="#f9a8d4" stroke-width="2" opacity=".7"/>
    <circle cx="205" cy="205" r="105" fill="#f9a8d4" opacity=".08"/>
    <image href="https://commons.wikimedia.org/wiki/Special:Redirect/file/Albert%20Einstein%20photo%201921.jpg"
           x="100" y="100" width="210" height="210" preserveAspectRatio="xMidYMid slice"
           clip-path="url(#c1)" filter="url(#hologram)" opacity=".82"/>
    <circle cx="205" cy="205" r="105" fill="url(#scan)" clip-path="url(#c1)"/>
  </g>
  <text x="205" y="340" text-anchor="middle" fill="#f9a8d4" font-family="Georgia,serif" font-size="19" font-weight="700">ALBERT EINSTEIN</text>
  <text x="205" y="363" text-anchor="middle" fill="#ddd6fe" font-family="Arial,sans-serif" font-size="12">RELATIVITY • PHYSICS</text>

  <!-- Newton -->
  <g filter="url(#glow)">
    <circle cx="600" cy="205" r="112" fill="none" stroke="#c084fc" stroke-width="2" opacity=".8"/>
    <circle cx="600" cy="205" r="105" fill="#c084fc" opacity=".08"/>
    <image href="https://commons.wikimedia.org/wiki/Special:Redirect/file/Portrait%20of%20Sir%20Isaac%20Newton%2C%201689.jpg"
           x="495" y="100" width="210" height="210" preserveAspectRatio="xMidYMid slice"
           clip-path="url(#c2)" filter="url(#hologram)" opacity=".82"/>
    <circle cx="600" cy="205" r="105" fill="url(#scan)" clip-path="url(#c2)"/>
  </g>
  <text x="600" y="340" text-anchor="middle" fill="#d8b4fe" font-family="Georgia,serif" font-size="19" font-weight="700">ISAAC NEWTON</text>
  <text x="600" y="363" text-anchor="middle" fill="#ddd6fe" font-family="Arial,sans-serif" font-size="12">MATHEMATICS • MECHANICS</text>

  <!-- Tesla -->
  <g filter="url(#glow)">
    <circle cx="995" cy="205" r="112" fill="none" stroke="#93c5fd" stroke-width="2" opacity=".8"/>
    <circle cx="995" cy="205" r="105" fill="#93c5fd" opacity=".08"/>
    <image href="https://commons.wikimedia.org/wiki/Special:Redirect/file/Nikola%20Tesla%20around%201890.jpg"
           x="890" y="100" width="210" height="210" preserveAspectRatio="xMidYMid slice"
           clip-path="url(#c3)" filter="url(#hologram)" opacity=".82"/>
    <circle cx="995" cy="205" r="105" fill="url(#scan)" clip-path="url(#c3)"/>
  </g>
  <text x="995" y="340" text-anchor="middle" fill="#bfdbfe" font-family="Georgia,serif" font-size="19" font-weight="700">NIKOLA TESLA</text>
  <text x="995" y="363" text-anchor="middle" fill="#ddd6fe" font-family="Arial,sans-serif" font-size="12">ELECTRICITY • INVENTION</text>

  <path d="M70 395 H1130" stroke="url(#holo)" stroke-width="1" opacity=".45"/>
  <text x="600" y="412" text-anchor="middle" fill="#f5d0fe" font-family="Arial,sans-serif" font-size="12" letter-spacing="3">QUESTION → MODEL → EXPERIMENT → DISCOVERY</text>
</svg>