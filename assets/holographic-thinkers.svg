<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Holographic Thinkers — Einstein, Newton and Tesla</title>
  <desc id="desc">Futuristic pink-purple STEM banner using portraits sourced from Wikimedia Commons.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop offset="0" stop-color="#10071b"/><stop offset=".5" stop-color="#2b1248"/><stop offset="1" stop-color="#0b1029"/></linearGradient>
    <linearGradient id="holo" x1="0" x2="1"><stop offset="0" stop-color="#ffb7e8"/><stop offset=".5" stop-color="#c084fc"/><stop offset="1" stop-color="#93c5fd"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#fff" stop-opacity=".25"/><stop offset=".45" stop-color="#e9d5ff" stop-opacity=".12"/><stop offset="1" stop-color="#c084fc" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#c084fc" stroke-width=".6" opacity=".09"/></pattern>
    <pattern id="scan" width="6" height="8" patternUnits="userSpaceOnUse"><rect width="6" height="2" fill="#fff" opacity=".16"/></pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="14"/></filter>
    <clipPath id="c1"><circle cx="205" cy="205" r="104"/></clipPath>
    <clipPath id="c2"><circle cx="600" cy="205" r="104"/></clipPath>
    <clipPath id="c3"><circle cx="995" cy="205" r="104"/></clipPath>
  </defs>

  <rect width="1200" height="430" rx="34" fill="url(#bg)"/>
  <rect x="18" y="18" width="1164" height="394" rx="26" fill="url(#grid)"/>
  <circle cx="80" cy="55" r="2" fill="#fff" opacity=".75"/><circle cx="1120" cy="72" r="2" fill="#fff" opacity=".8"/>
  <circle cx="1080" cy="365" r="3" fill="#f9a8d4" opacity=".8"/><circle cx="112" cy="355" r="2" fill="#c4b5fd" opacity=".8"/>

  <text x="600" y="48" text-anchor="middle" fill="#f5d0fe" font-family="Georgia,serif" font-size="25" font-weight="700" letter-spacing="5">HOLOGRAPHIC THINKERS ✦</text>
  <text x="600" y="78" text-anchor="middle" fill="#c4b5fd" font-family="Arial,sans-serif" font-size="14" letter-spacing="2">IDEAS • MATHEMATICS • PHYSICS • INVENTION</text>

  <!-- Einstein -->
  <g filter="url(#glow)">
    <circle cx="205" cy="205" r="124" fill="url(#glow)" filter="url(#soft)"/>
    <circle cx="205" cy="205" r="113" fill="none" stroke="#f9a8d4" stroke-width="2" opacity=".75"/>
    <g clip-path="url(#c1)">
      <image href="https://upload.wikimedia.org/wikipedia/commons/1/11/Albert_Einstein_photo_1921.jpg" x="100" y="101" width="210" height="340" preserveAspectRatio="xMidYMid slice"/>
      <rect x="101" y="101" width="208" height="208" fill="#d946ef" opacity=".16"/>
      <rect x="101" y="101" width="208" height="208" fill="url(#scan)" opacity=".75"/>
    </g>
    <circle cx="205" cy="205" r="104" fill="none" stroke="url(#holo)" stroke-width="2"/>
  </g>
  <text x="205" y="338" text-anchor="middle" fill="#f9a8d4" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="2">ALBERT EINSTEIN</text>
  <text x="205" y="360" text-anchor="middle" fill="#ddd6fe" font-family="Arial,sans-serif" font-size="11">RELATIVITY • PHYSICS</text>

  <!-- Newton -->
  <g filter="url(#glow)">
    <circle cx="600" cy="205" r="124" fill="url(#glow)" filter="url(#soft)"/>
    <circle cx="600" cy="205" r="113" fill="none" stroke="#c084fc" stroke-width="2" opacity=".75"/>
    <g clip-path="url(#c2)">
      <image href="https://upload.wikimedia.org/wikipedia/commons/3/3b/Portrait_of_Sir_Isaac_Newton%2C_1689.jpg" x="496" y="101" width="208" height="340" preserveAspectRatio="xMidYMid slice"/>
      <rect x="496" y="101" width="208" height="208" fill="#8b5cf6" opacity=".14"/>
      <rect x="496" y="101" width="208" height="208" fill="url(#scan)" opacity=".65"/>
    </g>
    <circle cx="600" cy="205" r="104" fill="none" stroke="url(#holo)" stroke-width="2"/>
  </g>
  <text x="600" y="338" text-anchor="middle" fill="#d8b4fe" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="2">ISAAC NEWTON</text>
  <text x="600" y="360" text-anchor="middle" fill="#ddd6fe" font-family="Arial,sans-serif" font-size="11">MATHEMATICS • MECHANICS</text>

  <!-- Tesla -->
  <g filter="url(#glow)">
    <circle cx="995" cy="205" r="124" fill="url(#glow)" filter="url(#soft)"/>
    <circle cx="995" cy="205" r="113" fill="none" stroke="#93c5fd" stroke-width="2" opacity=".75"/>
    <g clip-path="url(#c3)">
      <image href="https://upload.wikimedia.org/wikipedia/commons/6/65/Nikola_Tesla_around_1890.jpg" x="891" y="101" width="208" height="340" preserveAspectRatio="xMidYMid slice"/>
      <rect x="891" y="101" width="208" height="208" fill="#7dd3fc" opacity=".13"/>
      <rect x="891" y="101" width="208" height="208" fill="url(#scan)" opacity=".7"/>
    </g>
    <circle cx="995" cy="205" r="104" fill="none" stroke="url(#holo)" stroke-width="2"/>
  </g>
  <text x="995" y="338" text-anchor="middle" fill="#bfdbfe" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="2">NIKOLA TESLA</text>
  <text x="995" y="360" text-anchor="middle" fill="#ddd6fe" font-family="Arial,sans-serif" font-size="11">ELECTRICITY • INVENTION</text>

  <!-- Decorative B -->
  <text x="48" y="395" fill="#f9a8d4" opacity=".9" font-family="Georgia,serif" font-size="30" font-weight="700">B</text>
  <text x="1150" y="395" text-anchor="end" fill="#c4b5fd" opacity=".75" font-family="monospace" font-size="11">AI × MATH × FUTURE</text>
</svg>
